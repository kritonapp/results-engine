name: Release

# Publishes to npm when a GitHub Release is published (promote a tag -> Release), or
# manually via the Actions tab. The published version must equal package.json's version
# and the engine's FUNCTION_LIB_VERSION; the Kriton app's deployed-equals-published CI
# check enforces that the deployed app pins exactly this version.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm provenance (build attestation via OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      # Ensure a recent npm: provenance needs >= 9.5, and >= 11.5.1 lets us migrate to
      # tokenless trusted publishing (OIDC) once the package exists without editing this file.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Hard gate: the tarball must contain no parity oracle, tests, or raw source.
      - name: Tarball guard
        run: node scripts/check-pack.mjs
      # --provenance produces a verifiable build attestation linking the artifact to this
      # public source + workflow run. NODE_AUTH_TOKEN bootstraps the first publish; after a
      # trusted publisher is configured on npmjs.com it can be removed (OIDC takes over).
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
